name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew test --no-daemon
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      # Fake Texas (scripts/fake_texas.py) runs only here; production code has no switch for it.
      - run: scripts/compliance.sh
      - uses: navikt/copilot/cli/mcp-compliance@cli/mcp-compliance/v0.2.0
        with:
          url: http://127.0.0.1:8098/mcp
          tool: kodeverk_list
          token: ci-user-token
          app-token: ci-app-token
